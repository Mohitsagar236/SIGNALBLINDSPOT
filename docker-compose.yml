services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signalblindspot
      POSTGRES_PASSWORD: signalblindspot
      POSTGRES_DB: signalblindspot
    ports:
      - "5432:5432"
    volumes:
      - signalblindspot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalblindspot -d signalblindspot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signalblindspot-postgres:
